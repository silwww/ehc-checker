<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EHC Checker — Full Report</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128203;</text></svg>">
<link rel="stylesheet" href="/css/design-system.css">
<!-- Self-hosted. Was loaded from cdnjs, which makes PDF download depend on
     the venue's network: on conference or depot wifi that blocks or throttles
     a CDN, the button simply fails. Same file, same version (2.5.1). -->
<script src="/assets/jspdf.umd.min.js"></script>
<script src="/assets/fonts/geist-fonts-base64.js"></script>
<script src="/assets/certificate-fields.js"></script>
<script src="/assets/generate-pdf.js"></script>
<script src="/assets/render-report.js"></script>
<script src="/assets/logout.js" defer></script>
<script src="/assets/footer.js" defer></script>
</head>
<body data-ai-disclaimer>

<header class="app-header no-print">
  <div class="container app-header-inner">
    <div>
      <div class="app-brand">EHC Checker</div>
      <div class="app-tagline">Full Report</div>
    </div>
    <div class="row">
      <a href="/" class="text-sm text-medium back-link">← Back to Checker</a>
    </div>
  </div>
</header>

<main class="container app-main">

  <section id="report-section" hidden></section>

  <section id="audit-error-card" hidden style="margin-top: 32px;">
    <div class="flag-card flag-card-hard">
      <div class="flag-card-header">
        <h4 class="flag-card-title">Audit report failed</h4>
        <span class="badge badge-hard">ERROR</span>
      </div>
      <div id="audit-error-msg" class="flag-card-body" style="white-space: pre-wrap;"></div>
      <div style="margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap;">
        <button id="btn-audit-close" class="btn btn-secondary">Close tab</button>
      </div>
    </div>
  </section>

  <section id="audit-empty" hidden style="margin-top: 32px;">
    <div class="card-flat">
      <h2 class="text-lg text-medium" style="margin-bottom: 8px;">No audit payload available</h2>
      <p class="text-sm text-secondary" style="margin-bottom: 12px;">
        Please run a check from the home page first.
      </p>
      <a href="/" class="btn btn-primary" style="text-decoration: none;">Run a check</a>
    </div>
  </section>

</main>

<!-- Footer injected by /assets/footer.js. <body data-ai-disclaimer> opts this
     page in: it carries the most detailed AI output in the app and is the
     source of the exported PDF, so it was the one page that most needed the
     disclaimer and the only report page without it. -->

<script>
(function () {
  const reportEl = document.getElementById('report-section');
  const emptyEl = document.getElementById('audit-empty');
  const errorCardEl = document.getElementById('audit-error-card');
  const errorMsgEl = document.getElementById('audit-error-msg');
  const closeBtn = document.getElementById('btn-audit-close');

  closeBtn.addEventListener('click', () => {
    window.close();
  });

  // Render the single-call report payload staged in sessionStorage under
  // audit_report_payload by index.html's handleDownloadAudit (copied into
  // this tab by window.open, and surviving refresh within the tab).
  function runDisplay() {
    let data = null;
    try {
      const raw = sessionStorage.getItem('audit_report_payload');
      if (raw) data = JSON.parse(raw);
    } catch (e) {
      console.error('Failed to parse audit_report_payload:', e);
    }
    if (!data) {
      emptyEl.hidden = false;
      return;
    }
    showReport(data);
  }

  function showError(msg) {
    errorMsgEl.textContent = msg;
    errorCardEl.hidden = false;
  }

  function showReport(data) {
    reportEl.hidden = false;
    window.EHCRenderReport.render(reportEl, data, {
      onPrint: () => window.EHCGeneratePDF.generate(data, 'full')
    });
    // The Full Report is where the detail that justifies a rule actually
    // lives, so this is the natural place to propose from. The buttons were
    // always rendered here — they were hidden by CSS because only the
    // checker page carried the handler. Same handler, wired once.
    window.EHCRenderReport.wireProposeHandler(reportEl, function () {
      return {
        reportData: data,
        certRef: (data.certificate_info && data.certificate_info.certificate_ref) || ''
      };
    });
  }

  // Phase 2 single-call: the audit tab is display-only. The payload was
  // staged in sessionStorage by the opener (or survives a refresh); the
  // legacy ?action=generate URL now falls through to the same display path.
  runDisplay();
})();
</script>


</body>
</html>
