<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EHC Checker — Rule proposals</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#128203;</text></svg>">
<link rel="stylesheet" href="/css/design-system.css">
<script src="/assets/sidebar.js" defer></script>
</head>
<body>

<header class="app-header">
  <div class="container app-header-inner">
    <div class="row">
      <a href="index.html" class="text-sm text-medium back-link">← Back to Checker</a>
      <div class="app-brand">EHC Checker · Rule proposals</div>
    </div>
  </div>
</header>

<main class="container app-main">

  <div class="row-between" style="margin-bottom: 8px;">
    <h1 class="text-xl">Rule proposals</h1>
  </div>
  <p class="text-sm text-secondary" style="margin-bottom: 24px;">
    OVs propose from report findings; a reviewer approves or rejects. Approved rule text
    goes into the next Word delta for the rule set author.
  </p>

  <div id="storage-banner" hidden class="banner-warning" style="margin-bottom: 16px;"></div>
  <div id="load-error" hidden class="banner-error" style="margin-bottom: 16px;"></div>

  <div class="card-flat no-print" style="margin-bottom: 24px;">
    <div class="row" style="gap: 12px; align-items: center; flex-wrap: wrap;">
      <button id="btn-delta" class="btn btn-primary" disabled>Download delta for Roger</button>
      <span id="delta-count" class="text-sm text-secondary"></span>
      <a id="link-delta-again" class="text-sm" hidden href="/api/proposals/delta.docx?again=1">Re-download last delta</a>
    </div>
    <ul id="delta-preview" class="text-sm text-secondary" style="margin: 8px 0 0 0; padding-left: 20px;"></ul>
    <p id="delta-error" hidden class="banner-error" style="margin-top: 12px;"></p>
  </div>

  <div class="text-uppercase text-tertiary" style="margin-bottom: 12px;">Pending</div>
  <section id="pending-list" class="stack-3" style="margin-bottom: 32px;"></section>

  <div class="text-uppercase text-tertiary" style="margin-bottom: 12px;">Decided</div>
  <section id="decided-list" class="stack-3"></section>

</main>

<script>
(function () {
  'use strict';

  const pendingEl = document.getElementById('pending-list');
  const decidedEl = document.getElementById('decided-list');
  const storageBanner = document.getElementById('storage-banner');
  const loadError = document.getElementById('load-error');
  const btnDelta = document.getElementById('btn-delta');
  const deltaCount = document.getElementById('delta-count');
  const linkAgain = document.getElementById('link-delta-again');
  const deltaError = document.getElementById('delta-error');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
  }

  function severityBadge(sev) {
    if (!sev) return '';
    const cls = { hard: 'badge badge-hard', medium: 'badge badge-medium', low: 'badge badge-low' }[sev] || 'badge badge-neutral';
    return '<span class="' + cls + '">' + esc(sev.toUpperCase()) + '</span>';
  }

  function contextHTML(p) {
    return (
      '<div class="row" style="gap: 8px; flex-wrap: wrap; margin-bottom: 8px;">' +
        '<span class="text-mono text-sm">' + esc(p.certificate_ref) + '</span>' +
        (p.cert_type ? '<span class="text-sm text-secondary">EHC ' + esc(p.cert_type) + '</span>' : '') +
        severityBadge(p.flag_severity) +
        '<span class="text-sm text-tertiary">' + esc(String(p.created_at).slice(0, 10)) + ' · ' + esc(p.source_kind) + '</span>' +
      '</div>' +
      '<div class="text-md text-medium" style="margin-bottom: 6px;">' + esc(p.flag_title) + '</div>' +
      (p.flag_description ? '<p class="text-sm text-secondary" style="margin-bottom: 6px; white-space: pre-wrap;">' + esc(p.flag_description) + '</p>' : '') +
      (p.model_recommendation ? '<p class="text-sm" style="margin-bottom: 6px; white-space: pre-wrap;"><span class="text-tertiary">Model recommendation:</span> ' + esc(p.model_recommendation) + '</p>' : '') +
      (p.proposed_by ? '<p class="text-sm text-secondary" style="margin-bottom: 6px;"><span class="text-tertiary">Proposed by:</span> ' + esc(p.proposed_by) + '</p>' : '') +
      (p.proposer_note ? '<p class="text-sm text-secondary" style="margin-bottom: 6px;"><span class="text-tertiary">Proposer note:</span> ' + esc(p.proposer_note) + '</p>' : '')
    );
  }

  function pendingCard(p) {
    return (
      '<div class="card-flat" data-id="' + esc(p.id) + '">' +
        contextHTML(p) +
        '<p class="text-xs text-tertiary" style="margin-top: 12px; margin-bottom: 6px;">' +
          'Library = a new known name (consignee, destination, BCP, OV). Rule = a new check the app must perform.' +
        '</p>' +
        '<div class="row" style="gap: 8px; flex-wrap: wrap;">' +
          '<select class="classification-select" data-role="tier">' +
            '<option value="" selected disabled>— classify: rule or library? —</option>' +
            '<option value="rule">Rule text (→ Word delta)</option>' +
            '<option value="library">Library entry</option>' +
          '</select>' +
          '<input class="classification-select" data-role="reviewer" placeholder="Your name (required)" style="max-width: 180px;">' +
          '<input class="classification-select" data-role="note" placeholder="Note (optional)" style="max-width: 220px;">' +
          '<button class="btn btn-primary btn-sm" data-action="approved">Approve</button>' +
          '<button class="btn btn-secondary btn-sm" data-action="rejected">Reject</button>' +
        '</div>' +
        '<p class="banner-error" data-role="error" hidden style="margin-top: 10px;"></p>' +
      '</div>'
    );
  }

  function decidedCard(p) {
    const outcome = p.status === 'approved'
      ? '<span class="badge badge-pass">APPROVED' + (p.tier ? ' · ' + esc(p.tier) : '') + '</span>' +
        (!p.exported_at ? ' <span class="badge badge-medium">in next delta</span>' : '')
      : '<span class="badge badge-hard">REJECTED</span>';
    return (
      '<div class="card-flat">' +
        contextHTML(p) +
        '<div class="row" style="gap: 8px; flex-wrap: wrap; margin-top: 8px;">' +
          outcome +
          '<span class="text-sm text-secondary">by ' + esc(p.reviewed_by) + ' · ' + esc(String(p.reviewed_at).slice(0, 10)) + '</span>' +
          (p.decision_note ? '<span class="text-sm text-tertiary">' + esc(p.decision_note) + '</span>' : '') +
          (p.exported_at ? '<span class="text-sm text-tertiary">exported ' + esc(String(p.exported_at).slice(0, 10)) + '</span>' : '') +
        '</div>' +
      '</div>'
    );
  }

  async function loadProposals() {
    storageBanner.hidden = true;
    loadError.hidden = true;
    let body;
    try {
      const res = await fetch('/api/proposals');
      body = await res.json();
      if (res.status === 503) {
        storageBanner.textContent = '⚠️ ' + body.error;
        storageBanner.hidden = false;
        pendingEl.innerHTML = '';
        decidedEl.innerHTML = '';
        return;
      }
      if (!res.ok) throw new Error(body.error || res.statusText);
    } catch (err) {
      loadError.textContent = 'Could not load proposals: ' + err.message;
      loadError.hidden = false;
      return;
    }
    const all = body.proposals || [];
    const pending = all.filter((p) => p.status === 'pending');
    const decided = all.filter((p) => p.status !== 'pending');
    pendingEl.innerHTML = pending.length
      ? pending.map(pendingCard).join('')
      : '<p class="text-sm text-secondary">Nothing waiting. Propose from a report finding — the button lives on every flag.</p>';
    // Remembered identity: the shared password means the typed name IS
    // the audit identity — pre-fill it, keep it editable.
    try {
      const savedName = localStorage.getItem('ehc_identity') || '';
      if (savedName) pendingEl.querySelectorAll('[data-role="reviewer"]').forEach((i) => { i.value = savedName; });
    } catch (_) {}
    decidedEl.innerHTML = decided.length
      ? decided.map(decidedCard).join('')
      : '<p class="text-sm text-secondary">No decisions yet.</p>';

    // "Next delta" preview: the reviewer sees EXACTLY which titles ship
    // before clicking — the export marks immediately, so prevention
    // beats the re-download repair.
    const exportable = all.filter((p) => p.status === 'approved' && !p.exported_at);
    btnDelta.disabled = exportable.length === 0;
    deltaCount.textContent = exportable.length === 0
      ? 'No approved proposals awaiting export.'
      : 'Next delta will contain ' + exportable.length + ' proposal' + (exportable.length === 1 ? '' : 's') + ':';
    const previewEl = document.getElementById('delta-preview');
    previewEl.innerHTML = exportable.length === 0 ? '' :
      exportable.map((p) => '<li>' + esc(p.flag_title) + '</li>').join('');
    linkAgain.hidden = !all.some((p) => p.exported_at);
  }

  pendingEl.addEventListener('click', async (event) => {
    const btn = event.target.closest('button[data-action]');
    if (!btn) return;
    const card = btn.closest('.card-flat');
    const id = card.dataset.id;
    const decision = btn.dataset.action;
    const tier = card.querySelector('[data-role="tier"]').value;
    const reviewer = card.querySelector('[data-role="reviewer"]').value.trim();
    const note = card.querySelector('[data-role="note"]').value.trim();
    const errEl = card.querySelector('[data-role="error"]');
    errEl.hidden = true;
    if (decision === 'approved' && !tier) {
      errEl.textContent = 'Classify first: is this rule text for the master document, or a library entry?';
      errEl.hidden = false;
      return;
    }
    if (!reviewer) {
      errEl.textContent = 'Your name is required — the decision is recorded with it.';
      errEl.hidden = false;
      return;
    }
    btn.disabled = true;
    try {
      const res = await fetch('/api/proposals/' + encodeURIComponent(id) + '/decision', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ decision, tier: tier || undefined, reviewed_by: reviewer, note })
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || res.statusText);
      try { localStorage.setItem('ehc_identity', reviewer); } catch (_) {}
      await loadProposals();
    } catch (err) {
      btn.disabled = false;
      errEl.textContent = err.message;
      errEl.hidden = false;
    }
  });

  btnDelta.addEventListener('click', async () => {
    deltaError.hidden = true;
    btnDelta.disabled = true;
    // POST: the export marks proposals as exported (state change), so it
    // is deliberately not a GET navigation. The docx comes back as a blob.
    try {
      const res = await fetch('/api/proposals/delta.docx', { method: 'POST' });
      if (!res.ok) {
        const body = await res.json();
        throw new Error(body.error || res.statusText);
      }
      const blob = await res.blob();
      const dispo = res.headers.get('Content-Disposition') || '';
      const nameMatch = dispo.match(/filename="([^"]+)"/);
      const filename = nameMatch ? nameMatch[1] : 'EHC_Checker_rule_set_delta.docx';
      // Safari and iOS WebKit do not reliably honour a click on a detached
      // anchor, and revoking the object URL on the very next statement can
      // cancel the download before it starts. An iPad is a primary device
      // here, and the proposals are already marked exported by this point.
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.style.display = 'none';
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);

      // The server state has changed whether or not the browser saved a file,
      // so say what happened and name the way back — never let the queue
      // going quiet stand in for "you have the document".
      const partial = res.headers.get('X-Delta-Partial');
      deltaError.hidden = false;
      deltaError.style.color = partial ? 'var(--color-hard-accent)' : 'var(--color-text-secondary)';
      deltaError.textContent = (partial
        ? `PARTIAL EXPORT — only ${partial} approved proposals could be marked as exported; the rest stay queued for the next delta. `
        : '') +
        `Exported to ${filename}. If the download did not start, use "Re-download last delta".`;
      await loadProposals();
    } catch (err) {
      // Reset the colour: a previous success may have left this line neutral.
      deltaError.style.color = 'var(--color-hard-accent)';
      deltaError.textContent = err.message;
      deltaError.hidden = false;
      // loadProposals owns the button state (it disables when nothing is
      // exportable), so both paths end by letting it decide.
      await loadProposals();
    }
  });

  loadProposals();
})();
</script>

</body>
</html>
